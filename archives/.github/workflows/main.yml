name: 触发 Hugo 博客更新

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: 发送 repository_dispatch 事件
        env:
          TOKEN: ${{ secrets.BLOG_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::未配置 BLOG_DISPATCH_TOKEN，请在本仓库 Settings → Secrets and variables → Actions 中添加"
            exit 1
          fi
          curl -fSs -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/molicx/my-blog-source/dispatches \
            -d '{"event_type":"update-archives"}'
          echo "已通知 my-blog-source 重新构建"
